<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel do Gestor - Sistema de Ponto</title>
  <link rel="icon" href="assets/icons/icon-192.png" type="image/png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <main class="container">
    <header>
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <div style="display: flex; align-items: center; gap: 1rem;">
          <div class="brand-title">
            <i data-lucide="shield-check"></i>
            <span>Painel do Gestor / RH</span>
          </div>
          <span id="network-status-badge" style="font-size: 0.8rem; padding: 0.2rem 0.5rem; border-radius: 12px; background: rgba(255,255,255,0.1);">
            ● Online
          </span>
        </div>
        <div>
          <a href="index.html" class="outline" role="button" style="padding: 0.4rem 0.8rem; font-size: 0.9rem;">
            <i data-lucide="clock"></i> Modo Quiosque
          </a>
        </div>
      </div>
    </header>

    <!-- Notificação da Interface Admin -->
    <div id="admin-notification" style="display: none; margin-bottom: 1rem; padding: 0.75rem 1rem; border-radius: 4px;" aria-live="polite"></div>

    <!-- Navegação de Abas -->
    <nav>
      <ul>
        <li><a href="#dashboard" id="tab-dashboard" class="secondary" style="font-weight: 600;">Visão Geral & Banco de Horas</a></li>
        <li><a href="#registros" id="tab-registros" class="secondary">Registros & Ajustes</a></li>
        <li><a href="#auditoria" id="tab-auditoria" class="secondary">Trilha de Auditoria</a></li>
      </ul>
    </nav>

    <!-- Seção 1: Dashboard e Banco de Horas -->
    <section id="sec-dashboard">
      <h3>Visão Geral dos Colaboradores</h3>
      <figure>
        <table role="grid">
          <thead>
            <tr>
              <th>Nome</th>
              <th>Cargo</th>
              <th>Status</th>
              <th>Saldo de Horas</th>
              <th>Conformidade</th>
            </tr>
          </thead>
          <tbody id="tbl-employees">
            <tr><td colspan="5">Carregando dados...</td></tr>
          </tbody>
        </table>
      </figure>
    </section>

    <!-- Seção 2: Registros de Ponto e Ajustes -->
    <section id="sec-registros" style="display: none;">
      <h3>Registros de Ponto</h3>

      <!-- Filtros e Pesquisa -->
      <div class="grid">
        <label for="search-employee-text">
          Buscar por Nome/Cargo:
          <input type="search" id="search-employee-text" placeholder="Digite nome ou cargo...">
        </label>
        <label for="filter-employee">
          Colaborador:
          <select id="filter-employee">
            <option value="">Todos os Colaboradores</option>
          </select>
        </label>
        <label for="filter-date">
          Data de Referência:
          <input type="date" id="filter-date">
        </label>
      </div>

      <figure>
        <table role="grid">
          <thead>
            <tr>
              <th>Data/Hora</th>
              <th>Colaborador</th>
              <th>Tipo</th>
              <th>Data Ref.</th>
              <th>Origem</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="tbl-records">
            <tr><td colspan="6">Carregando registros...</td></tr>
          </tbody>
        </table>
      </figure>

      <!-- Paginação de Registros -->
      <div id="records-pagination" style="display: flex; justify-content: space-between; align-items: center; margin-top: 1rem;">
        <button type="button" class="outline secondary" id="btn-records-prev" style="width: auto;">&larr; Anterior</button>
        <span id="records-page-info">Página 1 de 1</span>
        <button type="button" class="outline secondary" id="btn-records-next" style="width: auto;">Próxima &rarr;</button>
      </div>
    </section>

    <!-- Modal de Ajuste Retroativo -->
    <dialog id="modal-adjust">
      <article style="max-width: 500px;">
        <header>
          <a href="#close" aria-label="Close" class="close" id="btn-close-modal"></a>
          <strong>Ajuste Retroativo de Ponto</strong>
        </header>
        <form id="form-adjust">
          <input type="hidden" id="adjust-record-id">

          <label for="adjust-timestamp">
            Nova Data / Hora:
            <input type="datetime-local" id="adjust-timestamp" required>
          </label>

          <label for="adjust-tipo">
            Tipo de Batida:
            <select id="adjust-tipo" required>
              <option value="entrada1">Entrada 1</option>
              <option value="saida1">Saída 1</option>
              <option value="entrada2">Entrada 2</option>
              <option value="saida2">Saída 2</option>
            </select>
          </label>

          <label for="adjust-motivo">
            Justificativa Obrigatória:
            <textarea id="adjust-motivo" rows="3" placeholder="Informe o motivo fundamentado do ajuste..." required></textarea>
          </label>

          <footer>
            <button type="button" class="secondary" id="btn-cancel-adjust">Cancelar</button>
            <button type="submit" id="btn-save-adjust">Salvar Ajuste</button>
          </footer>
        </form>
      </article>
    </dialog>

    <!-- Seção 3: Trilha de Auditoria -->
    <section id="sec-auditoria" style="display: none;">
      <h3>Trilha de Auditoria (Audit Trail)</h3>
      <figure>
        <table role="grid">
          <thead>
            <tr>
              <th>Data/Hora</th>
              <th>Usuário</th>
              <th>Ação</th>
              <th>Registro Afetado</th>
              <th>Justificativa</th>
            </tr>
          </thead>
          <tbody id="tbl-audit">
            <tr><td colspan="5">Carregando logs de auditoria...</td></tr>
          </tbody>
        </table>
      </figure>

      <!-- Paginação de Auditoria -->
      <div id="audit-pagination" style="display: flex; justify-content: space-between; align-items: center; margin-top: 1rem;">
        <button type="button" class="outline secondary" id="btn-audit-prev" style="width: auto;">&larr; Anterior</button>
        <span id="audit-page-info">Página 1 de 1</span>
        <button type="button" class="outline secondary" id="btn-audit-next" style="width: auto;">Próxima &rarr;</button>
      </div>
    </section>

  </main>

  <script type="module" src="js/admin-page.js"></script>
</body>
</html>
